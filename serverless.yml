service: miranda-backend

provider:
  name: aws
  region: ${env:AWS_REGION, 'eu-west-3'}
  runtime: nodejs20.x
  environment:
    TOKEN_SECRET: ${env:TOKEN_SECRET}
    MONGODB_URI: ${env:MONGODB_URI}
    DOMAIN_FRONT: ${env:DOMAIN_FRONT}

functions:
  app:
    handler: dist/lambda.handler
    events:
      - http:
          path: /
          method: ANY
          cors: true
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
login:
  handler: dist/lambda.handler 
  events:
    - http:
        path: /login
        method: POST
        cors:
          origins:
            - http://dashboard-miranda-mgl.s3-website.eu-west-3.amazonaws.com
          headers:
            - Content-Type
            - Authorization
          allowCredentials: true

package:
  patterns:
    - "!./**"
    - "package.json"
    - "node_modules/**"
    - "dist/**"

plugins:
  - serverless-dotenv-plugin
